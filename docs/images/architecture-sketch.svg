<svg width="1120" height="630" viewBox="0 0 1120 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="1" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2"/></filter>
    <style>
      .box { fill:#fffdf5; stroke:#1f2937; stroke-width:3; filter:url(#rough); }
      .note { fill:#fff7cc; stroke:#92400e; stroke-width:2; filter:url(#rough); }
      .txt { font-family:'Trebuchet MS', 'Comic Sans MS', Arial, sans-serif; fill:#111827; font-size:22px; }
      .small { font-family:'Trebuchet MS', Arial, sans-serif; fill:#374151; font-size:16px; }
      .arrow { stroke:#1f2937; stroke-width:3; fill:none; marker-end:url(#arrow); filter:url(#rough); }
      .thin { stroke:#d1d5db; stroke-width:1; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1f2937" /></marker>
  </defs>
  <rect width="1120" height="630" fill="#faf7ee"/>
  <!-- notebook lines -->
  <g opacity="0.55">
    <line class="thin" x1="0" y1="80" x2="1120" y2="80"/><line class="thin" x1="0" y1="130" x2="1120" y2="130"/><line class="thin" x1="0" y1="180" x2="1120" y2="180"/>
    <line class="thin" x1="0" y1="230" x2="1120" y2="230"/><line class="thin" x1="0" y1="280" x2="1120" y2="280"/><line class="thin" x1="0" y1="330" x2="1120" y2="330"/>
    <line class="thin" x1="0" y1="380" x2="1120" y2="380"/><line class="thin" x1="0" y1="430" x2="1120" y2="430"/><line class="thin" x1="0" y1="480" x2="1120" y2="480"/><line class="thin" x1="0" y1="530" x2="1120" y2="530"/>
    <line x1="70" y1="0" x2="70" y2="630" stroke="#f5b5b5" stroke-width="2"/>
  </g>
  <text x="95" y="55" class="txt" style="font-size:30px;font-weight:bold;">HarborCare SOC Alert Triage Lab - working sketch</text>

  <rect class="box" x="95" y="120" width="185" height="95" rx="16"/>
  <text x="125" y="160" class="txt">VPN + MFA</text>
  <text x="125" y="190" class="small">auth events</text>

  <rect class="box" x="395" y="115" width="205" height="105" rx="14"/>
  <text x="428" y="158" class="txt">Client portal</text>
  <text x="428" y="190" class="small">web access logs</text>

  <rect class="box" x="725" y="112" width="210" height="110" rx="18"/>
  <text x="762" y="155" class="txt">App server</text>
  <text x="762" y="188" class="small">endpoint events</text>

  <rect class="box" x="742" y="325" width="195" height="98" rx="14"/>
  <text x="770" y="365" class="txt">Vuln scan</text>
  <text x="770" y="395" class="small">risk context</text>

  <rect class="box" x="395" y="330" width="225" height="100" rx="16"/>
  <text x="420" y="372" class="txt">Python scripts</text>
  <text x="420" y="402" class="small">correlate + score</text>

  <rect class="box" x="120" y="332" width="190" height="95" rx="14"/>
  <text x="150" y="370" class="txt">Reports</text>
  <text x="150" y="400" class="small">technical + plain English</text>

  <path class="arrow" d="M282 166 C330 160, 352 158, 390 164"/>
  <path class="arrow" d="M605 165 C650 160, 678 159, 720 165"/>
  <path class="arrow" d="M820 227 C820 265, 820 290, 820 320"/>
  <path class="arrow" d="M735 374 C690 378, 660 378, 625 377"/>
  <path class="arrow" d="M390 378 C356 378, 338 378, 315 378"/>

  <rect class="note" x="105" y="500" width="290" height="80" rx="12"/>
  <text x="125" y="530" class="small">first pass was too noisy:</text>
  <text x="125" y="555" class="small">3 failed logins was not enough</text>

  <rect class="note" x="600" y="492" width="335" height="95" rx="12"/>
  <text x="620" y="522" class="small">later correction:</text>
  <text x="620" y="548" class="small">focus on unique users + chained evidence</text>
  <text x="620" y="574" class="small">before declaring incident</text>
</svg>