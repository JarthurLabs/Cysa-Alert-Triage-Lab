<svg width="850" height="330" viewBox="0 0 850 330" xmlns="http://www.w3.org/2000/svg">
  <rect width="850" height="330" fill="#f8fafc"/>
  <text x="35" y="38" font-family="Georgia" font-size="25" fill="#1f2937">How the logic improved</text>
  <g font-family="Verdana" font-size="14" fill="#111827">
    <g transform="rotate(-2 160 150)">
      <rect x="55" y="78" width="245" height="150" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
      <text x="75" y="110" font-weight="700">First idea</text>
      <text x="75" y="140">3 failures in 10 minutes</text>
      <text x="75" y="168">Problem: too noisy.</text>
      <text x="75" y="196">Normal typos got flagged.</text>
    </g>
    <g transform="rotate(1 430 150)">
      <rect x="330" y="92" width="245" height="150" rx="8" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
      <text x="350" y="124" font-weight="700">Correction</text>
      <text x="350" y="154">5+ unique users</text>
      <text x="350" y="182">same source IP</text>
      <text x="350" y="210">within 20 minutes</text>
    </g>
    <g transform="rotate(-1 705 150)">
      <rect x="605" y="70" width="200" height="170" rx="8" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
      <text x="625" y="105" font-weight="700">Better result</text>
      <text x="625" y="137">Less noise</text>
      <text x="625" y="165">More analyst-friendly</text>
      <text x="625" y="193">Still easy to explain</text>
    </g>
  </g>
  <path d="M302 155 C320 140, 320 140, 332 148" stroke="#6b7280" stroke-width="3" fill="none"/>
  <path d="M577 160 C594 144, 594 144, 606 152" stroke="#6b7280" stroke-width="3" fill="none"/>
</svg>